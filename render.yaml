services:
  - type: web
    name: sinka-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TITLE
        value: SINKA API
      - key: APP_VERSION
        value: "1.0.0"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Los siguientes se configuran manualmente en el Render dashboard (son secretos):
      # DATABASE_URL, JWT_SECRET, REDIS_URL, CORS_ORIGINS
